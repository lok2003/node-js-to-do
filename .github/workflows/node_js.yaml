name: Nodejs-Ci
on:
    push:
      branches:
        - dev 
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        node: [22.x,24.x]
    steps:
      - name: checkout code 
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: setup nodejs
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node }}
          cache: "npm"
      - name: Install dependencies
        run: npm install
      
      - name: run Test
        run: npm test

      # - name: Generate Coverage
      #   run: npx nyc npm test
      - name: Generate Coverage
        run: |
          npx nyc \
          --reporter=lcov \
          --reporter=text \
          npm test
      - name: Check Coverage Files
        run: |
         ls
         ls coverage
         cat coverage/lcov.info

      - name: SonarQube 
        if: matrix.node == '22.x'
        run: |
         npx sonar-scanner \
         -Dsonar.projectKey=${{ vars.PROJECT_KEY }} \
         -Dsonar.organization=${{ vars.ORG_NAME }} \
         -Dsonar.host.url=https://sonarcloud.io \
         -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info
        env:
          SONAR_TOKEN: ${{ secrets.NODE_TO_DO }}
      - name: Verify Artifact files
        run: |
          echo "Coverage Directory:"
          ls -al coverage
      - name: upload Coverage Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ matrix.node }}
          path: coverage/
