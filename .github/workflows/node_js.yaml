name: Nodejs-Ci
on:
    push:
      branches:
        - dev 
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code 
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: setup nodejs
        uses: actions/setup-node@v3
        with:
          node-version: 22.x
      - name: Install dependencies
        run: npm install
      
      - name: run Test
        run: npm test

      - name: Generate Coverage
        run: npx nyc npm test
      